<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Shared navigation -->
  <script src="/assets/nav.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .site-header {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #242936;
    }

    .brand {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }

    nav {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    nav a {
      color: #9ca6b5;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
    }

    nav a:hover {
      color: white;
      background: #151922;
    }

    nav a.active {
      color: white;
      background: #151922;
    }

    .login-shell {
      min-height: calc(100vh - 90px);
      display: grid;
      place-items: center;
      padding: 30px 20px;
    }

    .card {
      width: min(360px, 100%);
      background: #151922;
      border: 1px solid #2a3040;
      border-radius: 14px;
      padding: 28px;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #303746;
      background: #0e1118;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #7c8cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <!-- =========================
       SHARED TOP NAVIGATION
       ========================= -->
  <header class="site-header">

    <a class="brand" href="/">
      Tools Hub
    </a>

    <nav id="mainNav"></nav>

  </header>


  <!-- =========================
       LOGIN AREA
       ========================= -->
  <main class="login-shell">

    <div class="card">

      <h1>Admin Login</h1>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button id="loginButton">
        Sign In
      </button>

      <div id="message"></div>

    </div>

  </main>


  <script>
    /* =========================
       RENDER SHARED NAVIGATION
       ========================= */

    renderNav("Admin");


    /* =========================
       SUPABASE CONNECTION
       ========================= */

    const SUPABASE_URL =
      "https://yyjqfzrxyscmszybezvm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_FwJsCc4z9wpqb_pF1oSFIw_yJUjbw9V";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       LOGIN ELEMENTS
       ========================= */

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    /* =========================
       LOGIN
       ========================= */

    loginButton.addEventListener(
      "click",
      async () => {

        message.textContent =
          "Signing in...";

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: emailInput.value,
            password: passwordInput.value
          });

        if (error) {
          message.textContent =
            "Login failed: " +
            error.message;

          return;
        }

        message.textContent =
          "Login successful.";

        window.location.href =
          "/admin/dashboard/";
      }
    );

  </script>

</body>
</html>
