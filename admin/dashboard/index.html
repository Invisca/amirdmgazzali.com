<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <!-- Supabase JavaScript library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    header {
      border-bottom: 1px solid #242936;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      width: min(1000px, calc(100% - 32px));
      margin: 40px auto;
    }

    .card {
      background: #151922;
      border: 1px solid #2a3040;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 18px;
    }

    .muted {
      color: #9ca6b5;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #7c8cff;
      color: white;
    }

    .secondary {
      background: #242936;
      color: white;
    }

    #status {
      margin-top: 12px;
      color: #9ca6b5;
    }

    label {
      display: block;
      margin-bottom: 14px;
      color: #cfd5df;
    }

    input,
    textarea {
      width: 100%;
      margin-top: 7px;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #303746;
      background: #0e1118;
      color: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* Saved link cards */
    .link-item {
      border: 1px solid #303746;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      background: #0e1118;
    }

    .link-item h3 {
      margin: 0 0 6px;
    }

    .link-item p {
      margin: 4px 0;
      color: #9ca6b5;
    }

    .link-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .delete-button {
      background: #7a2d35;
      color: white;
    }
  </style>
</head>

<body>

  <!-- Top navigation -->
  <header>
    <h1>Admin Dashboard</h1>

    <button id="logoutButton" class="secondary">
      Log Out
    </button>
  </header>

  <main>

    <!-- =========================
         WELCOME / LOGIN STATUS
         ========================= -->
    <div class="card">
      <h2>Welcome</h2>

      <p class="muted">
        You are logged in.
      </p>

      <p id="userEmail"></p>

      <div id="status">
        Checking session...
      </div>
    </div>


    <!-- =========================
         ADD LINK FORM
         ========================= -->
    <div class="card">
      <h2>Add Link</h2>

      <!-- Link title -->
      <label>
        Title
        <input
          id="titleInput"
          type="text"
          placeholder="Example Website"
        >
      </label>

      <!-- Main website URL -->
      <label>
        URL
        <input
          id="urlInput"
          type="url"
          placeholder="https://example.com"
        >
      </label>

      <!-- Optional description -->
      <label>
        Description
        <textarea
          id="descriptionInput"
          placeholder="Short description"
        ></textarea>
      </label>

      <!-- Optional thumbnail image URL -->
      <label>
        Thumbnail URL
        <input
          id="thumbnailInput"
          type="url"
          placeholder="https://example.com/image.jpg"
        >
      </label>

      <!-- Optional category -->
      <label>
        Category
        <input
          id="categoryInput"
          type="text"
          placeholder="Tools"
        >
      </label>

      <!-- Controls display order later -->
      <label>
        Sort Order
        <input
          id="sortOrderInput"
          type="number"
          value="0"
        >
      </label>

      <button id="addLinkButton" class="primary">
        Add Link
      </button>

      <!-- Success/error message -->
      <div id="linkMessage" class="muted"></div>
    </div>


    <!-- =========================
         SAVED LINKS
         ========================= -->
    <div class="card">
      <h2>Saved Links</h2>

      <!-- JavaScript fills this section automatically -->
      <div id="savedLinks">
        Loading links...
      </div>
    </div>

  </main>


  <script>
    /* =========================
       SUPABASE CONNECTION
       ========================= */

    const SUPABASE_URL =
      "https://yyjqfzrxyscmszybezvm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_FwJsCc4z9wpqb_pF1oSFIw_yJUjbw9V";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       PAGE ELEMENTS
       ========================= */

    const status =
      document.getElementById("status");

    const userEmail =
      document.getElementById("userEmail");

    const logoutButton =
      document.getElementById("logoutButton");

    const addLinkButton =
      document.getElementById("addLinkButton");

    const linkMessage =
      document.getElementById("linkMessage");

    const savedLinks =
      document.getElementById("savedLinks");


    /* =========================
       CHECK LOGIN SESSION
       ========================= */

    async function checkSession() {
      const {
        data: { session },
        error
      } =
        await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);

        window.location.href =
          "/admin/";

        return;
      }

      // If user is not logged in,
      // send them back to the login page.
      if (!session) {
        window.location.href =
          "/admin/";

        return;
      }

      // Show logged-in user's email.
      userEmail.textContent =
        session.user.email;

      status.textContent =
        "Session active";
    }


    /* =========================
       LOG OUT
       ========================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        window.location.href =
          "/admin/";
      }
    );


    /* =========================
       ADD NEW LINK
       ========================= */

    addLinkButton.addEventListener(
      "click",
      async () => {

        // Read form values.
        const title =
          document
            .getElementById("titleInput")
            .value
            .trim();

        const url =
          document
            .getElementById("urlInput")
            .value
            .trim();

        const description =
          document
            .getElementById("descriptionInput")
            .value
            .trim();

        const thumbnailUrl =
          document
            .getElementById("thumbnailInput")
            .value
            .trim();

        const category =
          document
            .getElementById("categoryInput")
            .value
            .trim();

        const sortOrder =
          Number(
            document
              .getElementById("sortOrderInput")
              .value || 0
          );

        // Require at least title + URL.
        if (!title || !url) {
          linkMessage.textContent =
            "Title and URL are required.";

          return;
        }

        linkMessage.textContent =
          "Saving...";

        // Insert link into Supabase.
        const { error } =
          await supabaseClient
            .from("links")
            .insert([
              {
                title: title,
                url: url,
                description:
                  description || null,

                thumbnail_url:
                  thumbnailUrl || null,

                category:
                  category || null,

                sort_order:
                  sortOrder
              }
            ]);

        if (error) {
          console.error(error);

          linkMessage.textContent =
            "Error: " + error.message;

          return;
        }

        linkMessage.textContent =
          "Link added successfully.";

        // Clear form after saving.
        document.getElementById(
          "titleInput"
        ).value = "";

        document.getElementById(
          "urlInput"
        ).value = "";

        document.getElementById(
          "descriptionInput"
        ).value = "";

        document.getElementById(
          "thumbnailInput"
        ).value = "";

        document.getElementById(
          "categoryInput"
        ).value = "";

        document.getElementById(
          "sortOrderInput"
        ).value = "0";

        // Refresh saved links list.
        loadLinks();
      }
    );


    /* =========================
       LOAD SAVED LINKS
       ========================= */

    async function loadLinks() {
      savedLinks.textContent =
        "Loading links...";

      const { data, error } =
        await supabaseClient
          .from("links")
          .select("*")
          .order(
            "sort_order",
            { ascending: true }
          )
          .order(
            "created_at",
            { ascending: false }
          );

      if (error) {
        console.error(error);

        savedLinks.textContent =
          "Error loading links: " +
          error.message;

        return;
      }

      // No links yet.
      if (!data || data.length === 0) {
        savedLinks.textContent =
          "No links saved yet.";

        return;
      }

      // Clear loading text.
      savedLinks.innerHTML = "";

      // Create one card per link.
      data.forEach((link) => {
        const item =
          document.createElement("div");

        item.className =
          "link-item";

        item.innerHTML = `
          <h3>${link.title}</h3>

          <p>
            <a
              href="${link.url}"
              target="_blank"
              rel="noopener"
              style="color:#7c8cff;"
            >
              ${link.url}
            </a>
          </p>

          ${
            link.description
              ? `<p>${link.description}</p>`
              : ""
          }

          ${
            link.category
              ? `<p>Category: ${link.category}</p>`
              : ""
          }

          <div class="link-actions">
            <button
              class="delete-button"
              data-id="${link.id}"
            >
              Delete
            </button>
          </div>
        `;

        savedLinks.appendChild(item);
      });


      /* =========================
         DELETE LINK BUTTONS
         ========================= */

      document
        .querySelectorAll(".delete-button")
        .forEach((button) => {

          button.addEventListener(
            "click",
            async () => {

              const id =
                button.dataset.id;

              const confirmed =
                confirm(
                  "Delete this link?"
                );

              if (!confirmed) {
                return;
              }

              const { error } =
                await supabaseClient
                  .from("links")
                  .delete()
                  .eq("id", id);

              if (error) {
                alert(
                  "Delete failed: " +
                  error.message
                );

                return;
              }

              // Reload list after delete.
              loadLinks();
            }
          );
        });
    }


    /* =========================
       START DASHBOARD
       ========================= */

    checkSession();
    loadLinks();
  </script>

</body>
</html>
