<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    header {
      border-bottom: 1px solid #242936;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      width: min(1000px, calc(100% - 32px));
      margin: 40px auto;
    }

    .card {
      background: #151922;
      border: 1px solid #2a3040;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 18px;
    }

    .muted {
      color: #9ca6b5;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #7c8cff;
      color: white;
    }

    .secondary {
      background: #242936;
      color: white;
    }

    #status {
      margin-top: 12px;
      color: #9ca6b5;
    }

    label {
      display: block;
      margin-bottom: 14px;
      color: #cfd5df;
    }

    input,
      textarea {
      width: 100%;
      margin-top: 7px;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #303746;
      background: #0e1118;
      color: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }
  </style>
</head>

<body>

  <header>
    <h1>Admin Dashboard</h1>

    <button id="logoutButton" class="secondary">
      Log Out
    </button>
  </header>

  <main>

  <div class="card">
    <h2>Welcome</h2>

    <p class="muted">
      You are logged in.
    </p>

    <p id="userEmail"></p>

    <div id="status">
      Checking session...
    </div>
  </div>

  <div class="card">
    <h2>Add Link</h2>

    <label>
      Title
      <input id="titleInput" type="text" placeholder="Example Website">
    </label>

    <label>
      URL
      <input id="urlInput" type="url" placeholder="https://example.com">
    </label>

    <label>
      Description
      <textarea id="descriptionInput" placeholder="Short description"></textarea>
    </label>

    <label>
      Thumbnail URL
      <input id="thumbnailInput" type="url" placeholder="https://example.com/image.jpg">
    </label>

    <label>
      Category
      <input id="categoryInput" type="text" placeholder="Tools">
    </label>

    <label>
      Sort Order
      <input id="sortOrderInput" type="number" value="0">
    </label>

    <button id="addLinkButton" class="primary">
      Add Link
    </button>

    <div id="linkMessage" class="muted"></div>
  </div>

</main>

  <script>
    const SUPABASE_URL =
      "https://yyjqfzrxyscmszybezvm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_FwJsCc4z9wpqb_pF1oSFIw_yJUjbw9V";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const status =
      document.getElementById("status");

    const userEmail =
      document.getElementById("userEmail");

    const logoutButton =
      document.getElementById("logoutButton");

    async function checkSession() {
      const {
        data: { session },
        error
      } =
        await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);

        window.location.href =
          "/admin/";

        return;
      }

      if (!session) {
        window.location.href =
          "/admin/";

        return;
      }

      userEmail.textContent =
        session.user.email;

      status.textContent =
        "Session active";
    }

    logoutButton.addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        window.location.href =
          "/admin/";
      }
    );

    const addLinkButton =
      document.getElementById("addLinkButton");
    
    const linkMessage =
      document.getElementById("linkMessage");
    
    addLinkButton.addEventListener("click", async () => {
      const title =
        document.getElementById("titleInput").value.trim();
    
      const url =
        document.getElementById("urlInput").value.trim();
    
      const description =
        document.getElementById("descriptionInput").value.trim();
    
      const thumbnailUrl =
        document.getElementById("thumbnailInput").value.trim();
    
      const category =
        document.getElementById("categoryInput").value.trim();
    
      const sortOrder =
        Number(
          document.getElementById("sortOrderInput").value || 0
        );
    
      if (!title || !url) {
        linkMessage.textContent =
          "Title and URL are required.";
    
        return;
      }
    
      linkMessage.textContent =
        "Saving...";
    
      const { data, error } =
        await supabaseClient
          .from("links")
          .insert([
            {
              title: title,
              url: url,
              description: description || null,
              thumbnail_url: thumbnailUrl || null,
              category: category || null,
              sort_order: sortOrder
            }
          ])
          .select();
    
      if (error) {
        console.error(error);
    
        linkMessage.textContent =
          "Error: " + error.message;
    
        return;
      }
    
      linkMessage.textContent =
        "Link added successfully.";
    
      document.getElementById("titleInput").value = "";
      document.getElementById("urlInput").value = "";
      document.getElementById("descriptionInput").value = "";
      document.getElementById("thumbnailInput").value = "";
      document.getElementById("categoryInput").value = "";
      document.getElementById("sortOrderInput").value = "0";
    });

checkSession();
    checkSession();
  </script>

</body>
</html>
